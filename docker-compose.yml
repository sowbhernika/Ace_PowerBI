version: '3.8'

services:
  openwa-api:
    image: openwa/wa-automate:latest
    container_name: openwa-api
    ports:
      - "2785:2785"
    environment:
      - API_KEY=dev-admin-key
      - SESSION_ID=68b091ed-1aaa-42f5-a988-4a5138a596e9
    volumes:
      - openwa_data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  openwa_data: